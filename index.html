<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valle dell'Orco – climbing map</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<style>
  html, body, #map { height: 100%; margin: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .pin { display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; cursor: pointer;
         border-radius: 50% 50% 50% 0; transform: rotate(-45deg); border: 2px solid #fff;
         box-shadow: 0 1px 4px rgba(0,0,0,.4); }
  /* Icons are single-colour PNGs used as masks, so their colour is set in CSS */
  .glyph { display: inline-block; background-color: currentColor;
           -webkit-mask: var(--src) center / contain no-repeat; mask: var(--src) center / contain no-repeat; }
  .pin .glyph { width: 19px; height: 19px; color: #fff; transform: rotate(45deg); }
  .panel .glyph { width: 16px; height: 16px; vertical-align: -3px; margin: 0 3px 0 2px; }
  .maplibregl-popup-content { font-size: 13px; line-height: 1.45; max-width: 280px; padding: 12px 14px; }
  .maplibregl-popup-content h3 { margin: 0 0 4px; font-size: 15px; padding-right: 14px; }
  .tag { display: inline-block; font-size: 11px; color: #fff; border-radius: 3px; padding: 1px 6px; margin-bottom: 6px; }
  .approx { color: #888; font-size: 11px; margin-top: 6px; }
  .panel { background: #fff; padding: 8px 10px; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.3);
           font-size: 12px; line-height: 1.8; }
  .panel b { display: block; font-size: 13px; }
  .panel label { display: block; cursor: pointer; white-space: nowrap; }
  .panel a { color: #2E6FB0; }
  .seg { display: flex; gap: 2px; margin: 4px 0 2px; }
  .seg button { flex: 1; font: inherit; font-size: 12px; border: 1px solid #ccc; background: #f6f6f6;
                padding: 3px 6px; cursor: pointer; border-radius: 4px; }
  .maplibregl-ctrl.panel .seg button { width: auto; height: auto; color: #222; }
  .maplibregl-ctrl.panel .seg button:not(.on):hover { background: #e9e9e9; }
  .maplibregl-ctrl.panel .seg button.on, .maplibregl-ctrl.panel .seg button.on:hover { background: #333; color: #fff; border-color: #333; }
  @media (max-width: 480px) { .panel { font-size: 11px; line-height: 1.6; } }
</style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script>
// Edit the data here: [lat, lon], name, description, approx (true = position not verified)
const CATEGORIES = {
  // Colours all have at least 5.3:1 contrast with white (WCAG AA), for the white icons on the pins
  crag:  { label: "Crags",               icon: "icons/crag.png", color: "#B42318" },
  camp:  { label: "Campsites",           icon: "icons/camp.png", color: "#1E7A3E" },
  stay:  { label: "Huts, hotels & B&Bs", icon: "icons/stay.png", color: "#1F65A6" },
  town:  { label: "Towns & food",        icon: "icons/town.png", color: "#7A3C9A" }
};

const PLACES = [
  // Crags (from the PlanetMountain "Orco easy crack" guide + the big walls)
  { cat: "crag", ll: [45.4360, 7.2515], name: "Sergent", approx: true,
    desc: "Big multi-pitch wall and the classic cracks.<br><b>Easy-crack picks:</b> Incastromania 6a (hand jams), Mary Poppins 5c+, Paperoga (25m roof crack).<br>Also: Fessura Kosterlitz, Fissure du Panettone, Fessura della Disperazione.<br>Shade only in the afternoon in summer. Park after the long tunnel past Noasca and turn left." },
  { cat: "crag", ll: [45.4345, 7.2532], name: "Sergent pedestal", approx: true,
    desc: "Short cracks on the path from the car park to Sergent, ~5 min from La Peschiera campsite.<br><b>Viper 4c</b>, <b>Mamba 5a</b> (cams #0.75–#3), plus Piton on the arête." },
  { cat: "crag", ll: [45.4300, 7.2565], name: "Parete del Disertore", approx: true,
    desc: "Directly opposite Sergent, shaded in the morning.<br><b>Paris Texas 6b</b> finger crack (micro cams to #2), White Totem (Edlinger)." },
  { cat: "crag", ll: [45.4368, 7.2640], name: "Caporal", approx: true,
    desc: "250m granite wall next to Sergent. The central 'Scudo' (Shield) holds most of the multi-pitch routes." },
  { cat: "crag", ll: [45.4352, 7.2420], name: "Il Dado", approx: true,
    desc: "Popular crag above the village.<br><b>Apogeo 6a</b> (short vertical crack), <b>Mister Green 6b</b> (four-star chimney), Cochise, Bianca Parete." },
  { cat: "crag", ll: [45.4475, 7.2945], name: "Fessura del Tramonto (Sunset Crack)", approx: true,
    desc: "Below the long tunnel between Noasca and Ceresole – cross the stream to reach it.<br>30m <b>5c</b> crack; double set of cams recommended." },

  // Campsites
  { cat: "camp", ll: [45.43144, 7.25284], name: "Camping Casa Bianca",
    desc: "3★, Borgata Brengi 10, ~1500m. Right under the Sergent and Caporal walls. Open mid-April to end of October.",
    link: ["camping.info", "https://camping.info/en/campsite/camping-casa-bianca"] },
  { cat: "camp", ll: [45.4300, 7.2420], name: "Camping Piccolo Paradiso", approx: true,
    desc: "~3km from Ceresole centre. A main climbers' base on theCrag; Eldorado bouldering right next to it.",
    link: ["PNGP", "https://pngp.it/en/parco-accessibile/strutture/piccolo-paradiso-camping"] },
  { cat: "camp", ll: [45.4338, 7.2545], name: "Camping La Peschiera", approx: true,
    desc: "Listed on theCrag as a climbers' base; ~5 min walk to the Sergent pedestal.",
    link: ["meinwomo.net", "https://meinwomo.net/camperarea/italy-ceresole-reale-to-3004735.htm"] },

  // Huts, hotels, B&Bs
  { cat: "stay", ll: [45.4320, 7.2535], name: "Rifugio Le Fonti (Fonti Minerali)", approx: true,
    desc: "GTA hut with half board and on-site restaurant (Rifugio Pier Nigretti), next to Camping Casa Bianca. Reachable by car.",
    link: ["Turismo Torino", "https://turismotorino.org/visit/accommodation/le-fonti-minerali-1"] },
  { cat: "stay", ll: [45.4413, 7.2101], name: "Rifugio Massimo Mila",
    desc: "On the north side of Lago di Ceresole. Open all year, reachable by car.",
    link: ["PNGP", "https://www.pngp.it/en/marchio-qualita/massimo-mila-hut"] },
  { cat: "stay", ll: [45.4535, 7.3150], name: "Albergo Gran Paradiso + Posto Tappa di Noasca", approx: true,
    desc: "Bar-restaurant and 19-bed hostel, Via Umberto I, Noasca. Bernd Zangerl's pick for hungry climbers. Posto tappa open all year, booking needed: +39 0124 901003.",
    link: ["Posto tappa info", "https://www.planetmountain.com/en/mountain-huts/posto-tappa-di-noasca-valle-dell-orco.html"] },
  { cat: "stay", ll: [45.4120, 7.5400], name: "B&B Valle Orco", approx: true,
    desc: "Località Apparè 48, Sparone (lower valley). Recommended on theCrag; handy for lower-valley crags and boulders.",
    link: ["Hotels.com", "https://ie.hotels.com/ho1228154112/b-b-valle-orco-sparone-italy"] },

  // Towns & food
  { cat: "town", ll: [45.4322, 7.2357], name: "Ceresole Reale", desc: "Main base for the upper valley (~1600m): lake, shops, cafés. Sergent and Caporal are just down the valley." },
  { cat: "town", ll: [45.4540, 7.3160], name: "Noasca", desc: "Village below the long tunnel. Restobar Gran Paradiso for food." },
  { cat: "town", ll: [45.4163, 7.4631], name: "Locana", desc: "Larger village in the middle valley." },
  { cat: "town", ll: [45.4150, 7.5450], name: "Sparone", desc: "Lower valley, where the Orco climbing starts." }
];

// ---- Background maps -------------------------------------------------------
// "Map" = OpenStreetMap's own vector tiles (Shortbread schema, VersaTiles Colorful style).
// The style is a copy of https://vector.openstreetmap.org/styles/shortbread/colorful.json kept in
// this repo (OSM's style/sprite files don't allow cross-site loading); tiles come live from OSM.
const OSM_VECTOR_TILES = "https://vector.openstreetmap.org/shortbread_v1/{z}/{x}/{y}.mvt";
const DEM = { type: "raster-dem", tiles: ["https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png"],
              encoding: "terrarium", tileSize: 256, maxzoom: 14,
              attribution: '<a href="https://github.com/tilezen/joerd/blob/master/docs/attribution.md">Terrain: Mapzen/AWS</a>' };
const glyph = (c, color) =>
  `<i class="glyph" aria-hidden="true" style="--src:url('${c.icon}')${color ? `;color:${color}` : ""}"></i>`;
const here = path => new URL(path, location.href).href;

function rasterStyle(tiles, attribution, maxzoom) {
  return { version: 8, sources: { base: { type: "raster", tiles: [tiles], tileSize: 256, maxzoom, attribution } },
           layers: [{ id: "base", type: "raster", source: "base" }] };
}
const BASEMAPS = {
  Map: async () => {
    const s = await (await fetch(here("style.json"))).json();
    s.sprite = here("sprites/sprites");
    for (const src of Object.values(s.sources)) if (src.type === "vector") src.tiles = [OSM_VECTOR_TILES];
    return s;
  },
  Topo: async () => rasterStyle("https://a.tile.opentopomap.org/{z}/{x}/{y}.png",
    'Map data © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, SRTM | Style © <a href="https://opentopomap.org">OpenTopoMap</a> (CC-BY-SA)', 17),
  Satellite: async () => rasterStyle("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    "Imagery © Esri", 19)
};

let current = "Map";

async function buildStyle(name) {
  const s = await BASEMAPS[name]();
  s.sources.dem = DEM;
  if (name === "Map") {
    // Hill shading under the water, roads and labels so the valley's relief shows
    const i = s.layers.findIndex(l => l.id === "water-river");
    s.layers.splice(i < 0 ? 1 : i, 0, { id: "hillshade", type: "hillshade", source: "dem",
      paint: { "hillshade-exaggeration": 0.3, "hillshade-shadow-color": "#5a5a5a", "hillshade-highlight-color": "#ffffff" } });
  }
  return s;
}

const lls = PLACES.map(p => [p.ll[1], p.ll[0]]);
const boundsOf = pts => pts.reduce((b, p) => b.extend(p), new maplibregl.LngLatBounds(pts[0], pts[0]));
const upper = boundsOf(lls.filter(p => p[0] < 7.4));   // Ceresole–Noasca, where nearly everything is
const whole = boundsOf(lls);
// Leave room on the left for the panel (less on phones)
const PAD = innerWidth > 600 ? { top: 40, bottom: 40, right: 50, left: 210 } : 30;

(async () => {
  const map = new maplibregl.Map({
    container: "map", style: await buildStyle(current), bounds: upper,
    fitBoundsOptions: { padding: PAD },
    dragRotate: false, pitchWithRotate: false, touchPitch: false, maxPitch: 0,
    attributionControl: { compact: true, customAttribution: '<a href="https://www.openstreetmap.org/fixthemap">Fix the map</a> | Icons by <a href="https://icons8.com" target="_blank" rel="noopener">Icons8</a>' }
  });
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-right");
  map.touchZoomRotate.disableRotation();
  map.addControl(new maplibregl.ScaleControl({ unit: "metric" }), "bottom-right");

  // Pins
  const markers = {};
  for (const key of Object.keys(CATEGORIES)) markers[key] = [];
  for (const p of PLACES) {
    const c = CATEGORIES[p.cat];
    const el = document.createElement("div");
    el.innerHTML = `<div class="pin" style="background:${c.color}" title="${p.name}">${glyph(c)}</div>`;
    let html = `<h3>${p.name}</h3><span class="tag" style="background:${c.color}">${c.label}</span><div>${p.desc}</div>`;
    if (p.link) html += `<div style="margin-top:6px"><a href="${p.link[1]}" target="_blank" rel="noopener">${p.link[0]} ↗</a></div>`;
    if (p.approx) html += `<div class="approx">📍 Approximate position – check before driving.</div>`;
    const m = new maplibregl.Marker({ element: el, anchor: "bottom" })
      .setLngLat([p.ll[1], p.ll[0]])
      .setPopup(new maplibregl.Popup({ offset: [0, -36], maxWidth: "290px" }).setHTML(html))
      .addTo(map);
    markers[p.cat].push(m);
  }

  // Panel: background, categories, whole valley
  const panel = {
    onAdd() {
      const d = document.createElement("div");
      d.className = "maplibregl-ctrl panel";
      d.innerHTML = "<b>Valle dell'Orco</b>" +
        `<div class="seg" id="bm">${Object.keys(BASEMAPS).map(n => `<button data-n="${n}" class="${n === current ? "on" : ""}">${n}</button>`).join("")}</div>` +
        Object.entries(CATEGORIES).map(([k, c]) => `<label><input type="checkbox" data-cat="${k}" checked>${glyph(c, c.color)}${c.label}</label>`).join("") +
        `<a href="#" id="all">Show whole valley</a>`;
      d.querySelectorAll("#bm button").forEach(b => b.onclick = async () => {
        current = b.dataset.n;
        d.querySelectorAll("#bm button").forEach(x => x.classList.toggle("on", x === b));
        map.setStyle(await buildStyle(current));
      });
      d.querySelectorAll("[data-cat]").forEach(cb => cb.onchange = () =>
        markers[cb.dataset.cat].forEach(m => m.getElement().style.display = cb.checked ? "" : "none"));
      d.querySelector("#all").onclick = e => { e.preventDefault(); map.fitBounds(whole, { padding: PAD }); };
      return d;
    },
    onRemove() {}
  };
  map.addControl(panel, "top-left");
})();
</script>
</body>
</html>
